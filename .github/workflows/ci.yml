
name: RAGForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run lint checks
        run: ruff check src tests

      - name: Run static type checks
        run: mypy src/ragforge/parsing src/ragforge/chunking --ignore-missing-imports

      - name: Build package
        run: python -m build

      - name: Install and import built wheel in a clean environment
        run: |
          python -m venv /tmp/ragforge-package-check
          /tmp/ragforge-package-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ragforge-package-check/bin/python -c "import ragforge; import ragforge.parsing; import ragforge.chunking; print('ok')"
